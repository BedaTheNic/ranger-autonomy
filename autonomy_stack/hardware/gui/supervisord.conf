[supervisord]
nodaemon=true
user=root
logfile=/tmp/gui-supervisor.log
pidfile=/tmp/gui-supervisor.pid

[unix_http_server]
file=/tmp/gui-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/gui-supervisor.sock

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp +extension GLX +render -noreset
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:desktop]
command=/opt/autonomy/gui/with-display.sh /usr/bin/openbox
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vnc]
command=/opt/autonomy/gui/with-display.sh /usr/bin/x11vnc -display :99 -listen 127.0.0.1 -rfbport 15900 -forever -shared -nopw -noxdamage -quiet
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:browser]
command=/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:%(ENV_RANGER_GUI_PORT)s 127.0.0.1:15900
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rviz]
command=/opt/autonomy/gui/with-display.sh /opt/autonomy/entrypoint.sh ros2 run rviz2 rviz2 -d /tmp/ranger.rviz --ros-args -r __node:=autonomy_rviz
priority=30
autorestart=true
stopsignal=INT
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

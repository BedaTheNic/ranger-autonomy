ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    reset_on_time_jump: true
    use_control: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    # Fuse body velocities only. The encoder pose is derived from these same
    # samples and must not be counted as an independent position measurement.
    odom0: /wheel/odometry
    odom0_queue_size: 20
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    # Gyro yaw rate only. No simulator absolute heading or acceleration is
    # fused; yaw is relative and can drift, just like real inertial odometry.
    imu0: /imu/data
    imu0_queue_size: 20
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false

# Mini V2 SIMULATION parameters; not calibrated hardware limits.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.10
      movement_time_allowance: 25.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    # Duration warning threshold only; BT path validity decides when to plan.
    planner_plugins:
    - GridBased
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    # Humble IsPathValid reads this typed timeout; a literal XML override cannot
    # be converted to std::chrono::milliseconds by the installed plugin.
    default_server_timeout: 3000
    wait_for_service_timeout: 1000
    transform_tolerance: 0.3
    plugin_lib_names:
    - ranger_path_cache_bt
    - nav2_is_path_valid_condition_bt_node
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_rate_controller_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    cycle_frequency: 10.0
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins:
    - wait
    wait:
      plugin: nav2_behaviors/Wait
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      footprint: '[[0.32,0.30],[0.32,-0.30],[-0.32,-0.30],[-0.32,0.30]]'
      footprint_padding: 0.0
      plugins:
      - obstacle_layer
      - inflation_layer
      always_send_full_costmap: true
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.12
          obstacle_max_range: 3.0
          raytrace_min_range: 0.12
          raytrace_max_range: 3.5
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 3.0
      rolling_window: true
      width: 5
      height: 5
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      update_frequency: 2.0
      publish_frequency: 2.0
      resolution: 0.05
      footprint: '[[0.32,0.30],[0.32,-0.30],[-0.32,-0.30],[-0.32,0.30]]'
      footprint_padding: 0.0
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      always_send_full_costmap: true
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.12
          obstacle_max_range: 3.0
          raytrace_min_range: 0.12
          raytrace_max_range: 3.5
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 3.0
      track_unknown_space: true

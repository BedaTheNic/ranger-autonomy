# Integration checklist, NOT a ROS parameters file. Actual drivers are TBD.
# A driver may use another native topic/frame if launch remaps/TF are updated.
base:
  model: ranger_mini_v2
  interface: null  # confirm can0 and bitrate on the physical robot
  command_topic: /cmd_vel
  command_type: geometry_msgs/msg/Twist
  odometry_topic: /wheel/odometry
  odometry_type: nav_msgs/msg/Odometry
  odometry_frame: odom
  body_frame: base_link
  publish_odom_tf: false  # EKF owns odom -> base_link
lidar:
  model: null
  image: null
  launch: null
  device_or_ip: null
  topic: /scan
  type: sensor_msgs/msg/LaserScan
  frame: lidar_link
  extrinsics: null  # measured base_link -> lidar_link, not simulation values
imu:
  model: null
  image: null
  launch: null
  device_or_ip: null
  topic: /imu/data
  type: sensor_msgs/msg/Imu
  frame: imu_link
  extrinsics: null  # measured base_link -> imu_link
command_pipeline:
  navigation_input: /cmd_vel_nav
  base_output: /cmd_vel
  implementation: null  # arbitration, timeout, limits and stop integration

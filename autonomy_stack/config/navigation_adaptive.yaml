# SIMULATION: planner adds 4 cm internally; validity checks use executing footprint.
planner_server:
  ros__parameters:
    use_sim_time: false
    GridBased:
      plugin: ranger_nav_plugins::AdaptivePlanner
      minimum_turning_radius: 0.8
      forward_speed: 0.2
      reverse_speed: 0.15
      holonomic_speed: 0.2
      angular_speed: 0.25
      steering_rate: 1.0
      lattice_search_padding: 0.025
      planning_padding: 0.04
      goal_connection_distance: 0.25
      Ackermann:
        plugin: nav2_smac_planner/SmacPlannerHybrid
        tolerance: 0.15
        allow_unknown: false
        max_iterations: 1000000
        max_on_approach_iterations: 1000
        max_planning_time: 1.0
        smooth_path: true
        cache_obstacle_heuristic: false
        reverse_penalty: 1.5
        change_penalty: 0.3
        non_straight_penalty: 1.2
        cost_penalty: 3.0
        analytic_expansion_ratio: 3.5
        analytic_expansion_max_length: 4.4
        motion_model_for_search: REEDS_SHEPP
        minimum_turning_radius: 1.1
        angle_quantization_bins: 72
        downsample_costmap: false
        smoother:
          max_iterations: 1000
          w_smooth: 0.3
          w_data: 0.3
          tolerance: 1.0e-10
          do_refinement: true
      Holonomic:
        plugin: nav2_smac_planner/SmacPlannerLattice
        tolerance: 0.0
        allow_unknown: false
        max_iterations: 1000000
        max_on_approach_iterations: 1000
        max_planning_time: 1.0
        smooth_path: false
        cache_obstacle_heuristic: false
        reverse_penalty: 1.0
        change_penalty: 0.3
        non_straight_penalty: 1.1
        cost_penalty: 3.0
        analytic_expansion_ratio: 3.5
        analytic_expansion_max_length: 0.0
        lookup_table_size: 0.05
        allow_reverse_expansion: false
        rotation_penalty: 8.0
    expected_planner_frequency: 0.4
controller_server:
  ros__parameters:
    goal_checker:
      xy_goal_tolerance: 0.06
      # Position and heading must be satisfied together, including after a
      # final mode change or goal preemption.
      stateful: false
    use_sim_time: false
    controller_frequency: 10.0
    FollowPath:
      plugin: ranger_nav_plugins::AdaptiveController
      minimum_turning_radius: 0.8
      forward_speed: 0.2
      reverse_speed: 0.15
      holonomic_speed: 0.2
      angular_speed: 0.25
      steering_rate: 1.0
      minimum_mode_time: 2.0
      Ackermann:
        plugin: ranger_nav_plugins::AckermannController
        motion_model: Ackermann
        time_steps: 60
        model_dt: 0.1
        batch_size: 1200
        iteration_count: 3
        vx_std: 0.08
        vy_std: 0.0
        wz_std: 0.08
        vx_max: 0.2
        vx_min: -0.15
        vy_max: 0.0
        wz_max: 0.25
        temperature: 0.15
        gamma: 0.015
        prune_distance: 1.5
        transform_tolerance: 0.3
        visualize: true
        TrajectoryVisualizer:
          trajectory_step: 25
          time_step: 5
        AckermannConstraints:
          min_turning_r: 0.8
        critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        ConstraintCritic:
          enabled: true
          cost_weight: 4.0
          cost_power: 1
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 2.0
          critical_cost: 300.0
          consider_footprint: true
          collision_cost: 1000000.0
          near_goal_distance: 0.5
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 12.0
          threshold_to_consider: 1.4
        GoalAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 8.0
          threshold_to_consider: 1.0
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 32.0
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 2
          threshold_to_consider: 0.08
          offset_from_furthest: 1
          use_path_orientations: true
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 8.0
          offset_from_furthest: 3
          threshold_to_consider: 0.08
        enforce_path_inversion: true
        inversion_xy_tolerance: 0.04
        inversion_yaw_tolerance: 0.08
        tracking_acceleration: 0.3
        tracking_deceleration: 0.4
        tracking_steering_rate: 0.15
        tracking_wheelbase: 0.46
        tracking_track: 0.412
      Holonomic:
        plugin: ranger_nav_plugins::ProgressDWBController
        trajectory_generator_name: dwb_plugins::LimitedAccelGenerator
        min_vel_x: -0.2
        max_vel_x: 0.2
        min_vel_y: -0.2
        max_vel_y: 0.2
        max_vel_theta: 0.35
        min_speed_xy: 0.0
        max_speed_xy: 0.2
        min_speed_theta: 0.0
        acc_lim_x: 0.5
        acc_lim_y: 0.5
        acc_lim_theta: 0.5
        decel_lim_x: -0.5
        decel_lim_y: -0.5
        decel_lim_theta: -0.6
        vx_samples: 9
        vy_samples: 9
        vtheta_samples: 9
        sim_time: 3.0
        linear_granularity: 0.04
        angular_granularity: 0.04
        transform_tolerance: 0.3
        prune_distance: 1.5
        forward_prune_distance: 1.5
        xy_goal_tolerance: 0.06
        trans_stopped_velocity: 0.03
        stateful: true
        short_circuit_trajectory_evaluation: true
        publish_trajectories: false
        critics:
        - ModeConstraint
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - PathTracking
        - PathDist
        - GoalDist
        - SteeringContinuity
        - Twirling
        ModeConstraint.class: ranger_nav_plugins::ModeConstraintCritic
        ModeConstraint.scale: 1.0
        ModeConstraint.minimum_turning_radius: 0.8
        ObstacleFootprint.class: ranger_nav_plugins::MaxObstacleFootprintCritic
        ObstacleFootprint.scale: 0.2
        PathDist.scale: 16.0
        GoalDist.scale: 24.0
        RotateToGoal.scale: 32.0
        RotateToGoal.slowing_factor: 5.0
        RotateToGoal.lookahead_time: -1.0
        Twirling.scale: 5.0
        publish_evaluation: false
        sim_period: 0.1
        PathTracking.class: ranger_nav_plugins::PathTrackingCritic
        PathTracking.scale: 12.0
        SteeringContinuity.class: ranger_nav_plugins::SteeringContinuityCritic
        SteeringContinuity.scale: 0.35
        SteeringContinuity.wheelbase: 0.46
        SteeringContinuity.track: 0.412
local_costmap:
  local_costmap:
    ros__parameters:
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        inflation_radius: 1.0
global_costmap:
  global_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 1.0
      footprint_padding: 0.02

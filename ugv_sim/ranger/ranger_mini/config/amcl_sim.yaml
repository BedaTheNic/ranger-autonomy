map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: map
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    # Initial simulation values, not calibrated sensor/motion uncertainty.
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 10.0
    laser_likelihood_max_dist: 2.0
    max_beams: 120
    sigma_hit: 0.15
    z_hit: 0.95
    z_rand: 0.05
    z_short: 0.1
    z_max: 0.05
    lambda_short: 0.1
    do_beamskip: false
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # Refresh scan matching on small motions too, before slow yaw drift makes
    # distant scan endpoints visibly depart from the map (angles in radians).
    update_min_d: 0.02
    update_min_a: 0.01
    transform_tolerance: 0.3
    tf_broadcast: true
    # A new location must be supplied through RViz 2D Pose Estimate or initial_pose.
    set_initial_pose: false
    always_reset_initial_pose: true
    # Humble computes 1 / save_pose_rate; zero fails during configure.
    save_pose_rate: 0.5

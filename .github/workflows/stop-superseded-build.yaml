name: Stop superseded multi-architecture build
on:
  push:
    branches: [main]
    paths: [.github/workflows/stop-superseded-build.yaml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel the superseded amd64/arm64 release run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          status=$(gh api "repos/$GH_REPO/actions/runs/41440902324" --jq .status)
          if [[ "$status" != completed ]]; then
            gh api --method POST "repos/$GH_REPO/actions/runs/41440902324/cancel"
          fi

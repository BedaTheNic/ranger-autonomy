name: Verify and publish Ranger map viewer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'autonomy_stack/hardware/gui/**'
      - 'autonomy_stack/hardware/tests/gui_*'
      - 'autonomy_stack/hardware/tests/capture_rfb.py'
      - '.github/workflows/publish-gui.yaml'
permissions:
  contents: read
  packages: write
concurrency:
  group: ranger-gui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: autonomy_stack/hardware/gui/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ranger-autonomy:gui-test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=gui
          cache-to: type=gha,scope=gui,mode=max
      - name: RViz, noVNC and goal preview across isolated containers
        run: python3 autonomy_stack/hardware/tests/gui_smoke.py --output /tmp/ranger-gui-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranger-gui-validation
          path: /tmp/ranger-gui-validation
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested amd64 viewer
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}:jazzy-r3-gui"
          docker tag ranger-autonomy:gui-test "$image"
          docker push "$image"

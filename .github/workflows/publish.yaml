name: Verify and publish Ranger autonomy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image release tag
        required: true
        default: jazzy-r2
  push:
    tags: ['jazzy-*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: autonomy_stack/docker/Dockerfile.jazzy
          target: runtime
          load: true
          tags: ranger-autonomy:ci
          cache-from: type=gha,scope=verify
          cache-to: type=gha,mode=max,scope=verify
      - name: Original navigation and logger regression tests
        run: >-
          docker run --rm --network none ranger-autonomy:ci
          bash /opt/autonomy/hardware/tests/unit_tests.sh
      - name: Adaptive navigation and logging across separate containers
        run: python3 autonomy_stack/hardware/tests/compose_smoke.py --image ranger-autonomy:ci --output /tmp/ranger-ci-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranger-validation
          path: /tmp/ranger-ci-validation
      - name: Prepare robot deployment bundle
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then tag=ci; fi
          export DEPLOY_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
          bash autonomy_stack/hardware/release.sh bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ranger-hardware-deploy
          path: autonomy_stack/hardware/dist/ranger-hardware-deploy.tar.gz

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image reference
        id: image
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || exit 2
          echo "reference=ghcr.io/${GITHUB_REPOSITORY,,}:$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: autonomy_stack/docker/Dockerfile.jazzy
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

  release:
    if: github.event_name != 'pull_request'
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ranger-hardware-deploy
          path: deployment
      - name: Publish robot deployment archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || exit 2
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
          printf '%s\n' \
            "Ranger Mini ROS 2 Jazzy adaptive navigation with structured logging." \
            "" "Container image: \`$image\` (linux/amd64 and linux/arm64)." \
            "" "Download and extract ranger-hardware-deploy.tar.gz on the robot Docker host." \
            "The archive includes a non-secret .env preset for this release, Compose and robot.sh." \
            "" '```bash' 'bash robot.sh pull' 'bash robot.sh external' 'bash robot.sh check' '```' \
            "" "external uses the existing robot SLAM. For our SLAM, stop the existing SLAM only and run bash robot.sh mapping." \
            "" "Physical drive output remains disconnected pending steering-feedback and command-arbitration integration." \
            > deployment/RELEASE_NOTES.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" deployment/ranger-hardware-deploy.tar.gz --clobber
          else
            gh release create "$tag" deployment/ranger-hardware-deploy.tar.gz \
              --target "$GITHUB_SHA" --title "Ranger autonomy $tag" \
              --notes-file deployment/RELEASE_NOTES.md
          fi
